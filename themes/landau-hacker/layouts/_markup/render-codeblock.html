{{- $lang := .Attributes.lang | default "" -}}
{{- if eq $lang "mermaid" -}}
  <pre class="mermaid">{{ .Inner | safeHTML }}</pre>
{{- else -}}
  <pre><code class="language-{{ $lang }}">{{ .Inner | safeHTML }}</code></pre>
{{- end -}}
