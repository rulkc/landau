name: CI

# Build sanity check on every push and PR. Does NOT deploy.
# Production deploys are triggered by `release: published` (see
# `release-deploy.yml`). The built site is uploaded as an artifact for
# preview; artifacts are pruned to the 10 most recent or 7 days, whichever
# is hit first.

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # for pruning old artifacts

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Read pinned Hugo version + SHA256
        id: pin
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < .hugo-version)
          sha256=$(tr -d '[:space:]' < .hugo-sha256)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}"   >> "$GITHUB_OUTPUT"

      - name: Install Hugo extended (linux-amd64, pinned + SHA256-verified)
        env:
          HUGO_VERSION: ${{ steps.pin.outputs.version }}
          HUGO_SHA256:  ${{ steps.pin.outputs.sha256 }}
        run: |
          set -euo pipefail
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${tarball}"
          curl -fsSL --retry 3 "${url}" -o /tmp/hugo.tar.gz
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf /tmp/hugo.tar.gz -C "${RUNNER_TEMP}/hugo" hugo
          "${RUNNER_TEMP}/hugo/hugo" version
          echo "${RUNNER_TEMP}/hugo" >> "$GITHUB_PATH"

      - name: Build (production-equivalent, fail on warnings)
        run: |
          set -euo pipefail
          export HUGO_PARAMS_VERSION="dev-${GITHUB_SHA::7}"
          hugo --gc --minify --logLevel info --panicOnWarning

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: site-${{ github.sha }}
          path: public/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

  prune-artifacts:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'   # avoid double-pruning on PR + push
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Keep at most 10 most recent artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # First page (up to 100 most-recent artifacts) is enough for trim:
          # we always remove >>1 per run, so it converges in a couple of CI cycles.
          # No name filter — any artifact past the 10 newest goes.
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[10:] | .[].id' \
          | while read -r id; do
              echo "Deleting artifact ${id}"
              gh api -X DELETE \
                -H "Accept: application/vnd.github+json" \
                "repos/${{ github.repository }}/actions/artifacts/${id}"
            done
